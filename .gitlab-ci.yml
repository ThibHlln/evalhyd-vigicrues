stages:
  - test
  - build_docs
  - deploy_docs

# run integration tests
tests:
  stage: test
  image: mambaorg/micromamba
  script:
    # install dependencies of `evalhyd-vigicrues`
    - micromamba install --yes --file environment.yml

    # install `evalhyd-vigicrues` itself
    - pip install .

    # test package
    - (cd tests && python run_all_tests.py)

# generate docs with sphinx (HTML)
generate-docs:
  stage: build_docs
  image: mambaorg/micromamba
  script:
    # install dependencies of `evalhyd-vigicrues`
    - micromamba install --yes --file environment.yml

    # install `evalhyd-vigicrues` itself
    - pip install .

    # install dependencies to build docs of `evalhyd-vigicrues`
    - micromamba install --yes --file docs/environment-docs.yml

    # generate docs with `sphinx`
    - (cd docs && make local_html)
  artifacts:
    paths:
      - docs/__build/html/

# push HTML to GitHub repository
git-clone-push-github:
  stage: deploy_docs
  image: ubuntu
  script:
    # based on https://gitlab.com/gitlab-examples/ssh-private-key/-/blob/master/.gitlab-ci.yml

    # install ssh-agent if not already installed
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'

    # run ssh-agent (inside the build environment)
    - eval $(ssh-agent -s)
    - ssh-keyscan github.com

    # add the SSH private key stored in CI/CD variable to the agent store
    - echo "$SSH_PRIVATE_KEY_EVALHYD_GITHUB" | tr -d '\r' | ssh-add -

    # create the SSH directory and give it the right permissions
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # use ssh-keyscan to scan the keys of GitHub's server
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

    # clone evalhyd git repository on GitHub
    - git clone git@github.com:hydrogr/evalhyd-vigicrues.git html

    # configure user details
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"

    # copy locally build docs into git repository
    - \cp -rf ./docs/__build/html/. ./html/

    # remove DNS CNAME (ignore if does not exist)
    - rm -f ./html/CNAME

    # commit changes and push to GitHub remote
    - cd html
    - git add --all
    - git commit -m "update html"
    - git push origin main

  dependencies:
    - generate-docs
